[package]
edition = "2024"
name = "abs_kb_svc_v1_desktop"
version = "0.1.0"

description = "Protocol v1 between the desktop client (kb_admin_desktop) and kb_core."

[dependencies]
# LLM 语义词汇（`Role` / `LogicOutput` / `Capabilities` 等）：协议里直接复用它们，
# 不镜像第二套枚举。
abs_llm = { path = "../abs_llm" }

# `TrMayCancel` 与 `gen_mcf2` 展开的 future 约束都要求它；必须与运行栈同源
# （`cancel_rs`，不是旧的 `abs_cancel-rs`）。
abs_cancel = { workspace = true }

# 本机 MPTP 线上与本地存储的编解码（denco）。
abs_denco = { workspace = true }
denco_macro = { workspace = true }
# denco 派生展开出的可取消 future 需要它。
gen_mcf2 = { workspace = true }

# 系统层握手的消息（`IpcReadyNotice` / `HandshakeNoticeKind`）。它们在独立 crate 里
# ——只想启动并找到 `kb_core` 的调用方（`kb_core_starter`）因此不必依赖整套业务协议；
# 本 crate 把它们转出来，让桌面协议的公开面同时包含两个层次。
abs_kb_core_handshake = { path = "../abs_kb_core_handshake" }


# 仅用于生成 kb_core 分配的标识（`<前缀>-<uuid-v4>`）。
uuid = { version = "1.*", features = ["v4", "fast-rng"] }

[dev-dependencies]
# 集成测试里用 `block_on` 驱动编解码 future。
futures-lite = { workspace = true }
# 校验协议类型在 MessagePack 上往返。
mp_denco = { workspace = true }

