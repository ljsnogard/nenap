[package]
edition = "2024"
name = "kb_core_rproxy"
version = "0.1.0"
authors = ["lino <lino_snsalias@outlook.com>"]

description = "LAN application-layer gateway in front of kb_core (no auth yet)."

# 只属于本 crate 的依赖直接写在这里；只有跨成员共用的依赖才放 workspace。
[dependencies]
# 协议数据类型（信封就是本网关搬运的东西）。
abs_kb_svc = { path = "../../../kb_svc/crates/abs_kb_svc" }

# 系统层握手：启动 kb_core 子进程并等它公布 IPC 端点文件名。
# 这段逻辑原本长在本 crate 的 `src/launch_.rs` 里，现在独立成可复用的 crate
# （桌面客户端也要用它起本机的 kb_core）。它属于服务侧，因此放在 `kb_svc/crates/`。
kb_core_starter = { path = "../kb_core_starter" }

# TCP 帧格式：本网关与远程客户端共用同一份编解码（原来长在本 crate 的
# `src/frame_.rs` 里，客户端拿不到，只能抄一份）。本 crate 只保留 compio 侧的写。
kb_core_rproxy_wire = { path = "../kb_core_rproxy_wire" }

# 上游客户端：本网关用它的 `send_envelope` 原样转发信封。
kb_svc_mptp_ipc = { path = "../kb_svc_mptp_ipc" }

# 异步运行时与 TCP。`net` feature 在根 Cargo.toml 的 compio 条目里开启。
compio = { workspace = true }

# 完成量：转发侧收工时叫醒读侧（它可能正停等在满环上）。
futures-channel = "0.3"

# `SinkExt::send`：向上行通道写块（有界时自动等待）。
futures = "0.3"

# `zip` / `or`：把读侧与转发侧并发跑在同一个任务里。
futures-lite = { workspace = true }

env_logger = { version = "0.11.*" }
log = { workspace = true }

# `ring_` 的错误类型用它派生 `Error`。
thiserror = { workspace = true }

[[bin]]
name = "kb-core-rproxy"
path = "src/main.rs"
